apiVersion: v1
kind: Namespace
metadata:
  name: drainsim-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdb-demo
  namespace: drainsim-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pdb-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pdb-demo
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-demo
  namespace: drainsim-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pdb-demo
