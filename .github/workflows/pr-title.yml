name: PR title

# Separate from ci.yml so that editing a PR title re-runs only this check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^[:space:]]'
          if [[ ! $PR_TITLE =~ $pattern ]]; then
            echo "::error::Use a Conventional Commit title, for example: feat: PDB 분석 추가"
            exit 1
          fi
