name: 버그 제보
description: 잘못된 동작이나 문서 오류를 알려 주세요.
title: "[Bug] "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        현재 프로젝트는 초기 설계 단계이며 개발 코드는 아직 없습니다.
        구현 이후의 버그뿐 아니라 재현 가능한 설계·문서 문제도 제보할 수 있습니다.
        보안 취약점은 공개 이슈 대신 [비공개 보안 제보](https://github.com/kang0225/kube-drainsim/security/advisories/new)를 이용해 주세요.
  - type: textarea
    id: summary
    attributes:
      label: 어떤 문제인가요?
      description: 문제가 발생하는 상황과 영향을 간단히 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 실행 순서, 명령, 최소한의 입력을 적어 주세요. 문서 문제는 파일 경로나 링크를 적어 주세요.
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 오류 메시지나 잘못된 출력이 있다면 민감한 정보를 지운 뒤 포함해 주세요.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 관련된 버전만 적고, 실행 환경과 무관한 문제라면 '해당 없음'으로 적어 주세요.
      placeholder: |
        drainsim 버전 또는 커밋:
        Kubernetes 버전:
        kind 버전 또는 사용한 클러스터 환경:
        OS / 아키텍처:
        Go 버전(빌드 문제인 경우):
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: 추가 근거
      description: 관련 로그, JSON 출력, 스크린샷, 관련 이슈를 첨부할 수 있습니다. 토큰과 실제 운영환경 식별자는 제거해 주세요.
  - type: checkboxes
    id: disclosure_check
    attributes:
      label: 공개 전 확인
      options:
        - label: 토큰, kubeconfig, 개인정보와 민감한 운영정보를 제거했습니다.
          required: true
        - label: 악용 가능한 보안 취약점 제보가 아닙니다. 보안 문제는 비공개 제보 경로를 사용하겠습니다.
          required: true
