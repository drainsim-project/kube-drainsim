name: 버그 제보
description: 잘못된 동작이나 문서 오류를 알려 주세요.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: 어떤 문제인가요?
      description: 문제가 발생하는 상황과 영향을 간단히 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 실행 순서, 명령, 최소한의 입력을 적어 주세요. 문서 문제는 파일 경로나 링크를 적어 주세요.
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 기대한 결과와 실제 결과
      description: 오류 메시지나 잘못된 출력은 민감한 정보를 지운 뒤 붙여 주세요.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 문제와 관련된 버전만 적어 주세요.
      placeholder: |
        drainsim 커밋:
        Kubernetes 버전:
        kind 버전 또는 클러스터 환경:
        OS / 아키텍처:
  - type: checkboxes
    id: disclosure_check
    attributes:
      label: 공개 전 확인
      options:
        - label: 토큰, kubeconfig, 개인정보와 민감한 운영정보를 제거했습니다.
          required: true
