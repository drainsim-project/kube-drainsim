name: drain 검증 시나리오
description: drainsim의 판단을 실제 drain과 비교할 사례를 제안합니다.
title: "[Scenario] "
labels: [scenario]
body:
  - type: markdown
    attributes:
      value: 재현은 kind 같은 폐기 가능한 환경에서 합니다. 실행 결과는 이 이슈를 해결하는 PR의 검증 체크리스트에 남깁니다.
  - type: textarea
    id: scenario
    attributes:
      label: 시나리오와 확인할 가설
      description: 노드, 워크로드, PDB의 관계와 확인하려는 조건을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: manifests
    attributes:
      label: 최소 재현 manifest
      description: 필요한 Node 설정, 워크로드, PDB를 적어 주세요.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대하는 결과와 근거
      description: 어떤 Pod가 어떤 결과(evictable, no-budget, blocked 등)가 될지와 그 이유를 적어 주세요.
    validations:
      required: true
  - type: input
    id: kubernetes_version
    attributes:
      label: Kubernetes 버전
      placeholder: "v1.34.11"
