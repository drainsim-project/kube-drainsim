name: 기능 제안
description: 해결할 문제와 제안하는 기능 또는 설계 방향을 알려 주세요.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 제안 배경
      description: 누가 어떤 상황에서 어려움을 겪는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 동작 또는 설계
      description: 입력과 기대하는 결과, 처음에 만들 범위와 뒤로 미룰 부분을 적어 주세요. 구현 방법은 확정하지 않아도 됩니다.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 완료 확인 방법
      description: 확인할 예시와 기대 결과를 적어 주세요.
  - type: textarea
    id: alternatives
    attributes:
      label: 대안과 고려할 점
      description: 기존 도구, 더 작은 해결책, 예상되는 제약이 있다면 적어 주세요.
